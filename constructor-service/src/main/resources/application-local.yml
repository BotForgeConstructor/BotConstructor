spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/bot_constructor}
    username: ${SPRING_DATASOURCE_USERNAME:bot_constructor}
    password: ${SPRING_DATASOURCE_PASSWORD:local_dev_password}
app:
  bot:
    webhook:
      base-url: ${APP_BOT_WEBHOOK_BASE_URL:http://localhost:8080/api/v1/telegram/webhooks}
  auth:
    telegram:
      max-init-data-age: ${APP_AUTH_TELEGRAM_MAX_INIT_DATA_AGE:5m}
      allowed-future-skew: ${APP_AUTH_TELEGRAM_ALLOWED_FUTURE_SKEW:30s}
    session:
      signing-key: ${APP_SESSION_SIGNING_KEY}
      issuer: ${APP_SESSION_ISSUER:https://bot-constructor.local.invalid}
      audience: ${APP_SESSION_AUDIENCE:bot-constructor-api}
      ttl: ${APP_SESSION_TTL:15m}
  security:
    bot-credentials:
      key: ${APP_BOT_CREDENTIAL_ENCRYPTION_KEY}
      key-id: ${APP_BOT_CREDENTIAL_ENCRYPTION_KEY_ID:v1}
  web:
    url: ${APP_WEB_URL:http://localhost:5173}
  telegram:
    api:
      base-url: ${APP_TELEGRAM_API_BASE_URL:https://api.telegram.org}
      connect-timeout: ${APP_TELEGRAM_API_CONNECT_TIMEOUT:3s}
      read-timeout: ${APP_TELEGRAM_API_READ_TIMEOUT:5s}
    management:
      enabled: ${APP_TELEGRAM_MANAGEMENT_ENABLED:false}
      connection-mode: ${APP_TELEGRAM_MANAGEMENT_CONNECTION_MODE:LONG_POLLING}
      token: ${APP_TELEGRAM_MANAGEMENT_TOKEN:}
      username: ${APP_TELEGRAM_MANAGEMENT_USERNAME:}
      mini-app:
        url: ${APP_TELEGRAM_MINI_APP_URL:http://localhost:5173}
      webhook:
        enabled: ${APP_TELEGRAM_MANAGEMENT_WEBHOOK_ENABLED:false}
        secret: ${APP_TELEGRAM_MANAGEMENT_WEBHOOK_SECRET:}
        path: ${APP_TELEGRAM_MANAGEMENT_WEBHOOK_PATH:/api/v1/telegram/management/webhook}
